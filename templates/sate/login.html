<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATE - Iniciar Sesión</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="theme-blue login-page">

    <div class="login-wrapper">
        <h2 class="login-title">TechTrack SATE</h2>

        <div class="form-container login-card">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">

                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required autocomplete="username" placeholder="admin@techtrack.com">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">

                <button type="submit" class="btn-primary btn-block">Ingresar a SATE</button>
            </form>

            <div class="login-back">
                <a href="{{ url_for('inicio') }}">← Volver al sitio público</a>
            </div>
        </div>
    </div>

</body>
</html>
